name: Build
# Workflow trigger Event
on:
  push:
    # Publish semver tags as releases.
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v4 lets the
      # action author, or anyone who compromises them, change what runs here.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image under test
        run: docker build . -t dumptruck:integration

      # Exercises the real dump -> encrypt -> upload -> retention -> restore
      # cycle against live MariaDB and PostgreSQL containers.
      - name: Run integration tests
        run: docker compose -f test/docker-compose.yml run --rm tests

      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f test/docker-compose.yml down -v --remove-orphans

  build:
    name: Build (and Push)
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build (and push) Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
